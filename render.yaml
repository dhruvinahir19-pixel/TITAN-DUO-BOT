services:
  - type: web
    name: titan-duo-bot
    runtime: docker
    region: singapore
    plan: free
    autoDeploy: true
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: "8000"
      - key: EXECUTION_MODE
        value: "PAPER"
      - key: BASE_RISK_PCT
        value: "0.03"
      - key: DATABASE_URL
        sync: false
      - key: COINSWITCH_API_KEY
        sync: false
      - key: COINSWITCH_SECRET_KEY
        sync: false
      - key: COINSWITCH_PROXY_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
